services:
  web:
    build: .
    image: safarnama-diaries:latest
    container_name: safarnama-diaries
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      # Required: password for /admin (set it in the .env file)
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Please set ADMIN_PASSWORD in the .env file}
      DATA_DIR: /data
    volumes:
      # Keeps safarnama.db and uploaded photos when the container is rebuilt
      - safarnama-data:/data

volumes:
  safarnama-data:
